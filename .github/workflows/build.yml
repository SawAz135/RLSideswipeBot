name: Build RLSideswipeBot .dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          brew install ldid xz
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=${{ github.workspace }}/theos" >> $GITHUB_ENV
          echo "${{ github.workspace }}/theos/bin" >> $GITHUB_PATH

      - name: Download iOS SDK
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          # Download prebuilt SDK directly (no GitHub API token needed)
          curl -LO https://github.com/theos/sdks/archive/master.tar.gz
          tar -xzf master.tar.gz
          mkdir -p $THEOS/sdks
          cp -r sdks-master/iPhoneOS*.sdk $THEOS/sdks/

      - name: Build dylib
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          make clean
          make FINALPACKAGE=0

      - name: Upload .dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: RLSideswipeBot_v1-dylib
          path: .theos/obj/debug/RLSideswipeBot_v1.dylib
          retention-days: 30
